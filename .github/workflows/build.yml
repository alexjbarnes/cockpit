name: Build and Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: git branch -r --contains ${{ github.sha }} | grep -q origin/main

  typecheck:
    needs: verify-tag
    uses: ./.github/workflows/typecheck.yml
  compile:
    needs: verify-tag
    uses: ./.github/workflows/compile.yml
  lint:
    needs: verify-tag
    uses: ./.github/workflows/lint.yml
  secrets:
    needs: verify-tag
    uses: ./.github/workflows/secrets.yml

  test:
    needs: [verify-tag, typecheck, lint, secrets]
    uses: ./.github/workflows/test.yml
